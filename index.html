<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day ❤️</title>

<style>
:root{ --kiss-red:#ff003c; }

body{
margin:0;height:100vh;overflow:hidden;
display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle,#300,#000);
font-family:Poppins,sans-serif;color:#fff;
}

/* Floating Card */
.card{
text-align:center;width:85%;max-width:400px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
padding:30px;border-radius:40px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 50px rgba(0,0,0,.6);
animation:floatCard 6s ease-in-out infinite;
z-index:10;
}
@keyframes floatCard{50%{transform:translateY(-10px)}}
.heartbeat{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* BUTTON */
#holdBtn{
background:linear-gradient(45deg,var(--kiss-red),#800020);
border:none;color:#fff;padding:18px 40px;
border-radius:50px;font-size:18px;font-weight:bold;
cursor:pointer;
}

/* CLICK HERE BUTTON */
#kissBtn{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#ff003c,#ff4d6d);
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,0,60,.5);
}

#kissMsg{
margin-top:12px;
font-size:14px;
color:#ffd6df;
min-height:20px;
transition:.4s;
}

/* HEART FALL BG */
@keyframes fall{to{transform:translateY(110vh);opacity:0}}
.bgHeart{position:fixed;top:-50px;font-size:22px;animation:fall 7s linear forwards}

/* Kiss Frame */
.kiss-frame{
width:220px;height:180px;margin:20px auto;
background:url('https://cdn-icons-png.flaticon.com/512/2921/2921102.png') center/contain no-repeat;
display:flex;justify-content:center;align-items:center;
}
.kiss-frame img{
width:100px;height:100px;border-radius:50%;
object-fit:cover;transition:.8s;
}

/* Cartoon Couple */
.couple{position:relative;width:200px;height:140px;margin:auto;}
.head{width:70px;height:70px;border-radius:50%;position:absolute;top:20px;}
.boy{left:20px;background:#ffd1dc;}
.girl{right:20px;background:#ffe4ec;}
.eye{width:6px;height:6px;background:#000;border-radius:50%;position:absolute;top:30px;}
.boy .eye{left:20px}
.girl .eye{right:20px}
.lips{position:absolute;width:20px;height:10px;background:#ff4d6d;border-radius:10px;top:45px;}
.boy .lips{right:-5px}
.girl .lips{left:-5px}
@keyframes kissMove{to{transform:translateX(30px);}}
@keyframes kissMoveGirl{to{transform:translateX(-30px);}}
.kiss-heart{position:absolute;left:50%;top:10px;font-size:30px;opacity:0;animation:heartPop 1s forwards 1.2s;}
@keyframes heartPop{to{opacity:1;transform:translateY(-20px) scale(1.4);}}

#celebration{display:none}
</style>
</head>

<body>

<div class="card heartbeat">
<div id="asking">
<div style="font-size:50px">💓</div>
<h2>Hold to send my heart 💞</h2>
<button id="holdBtn">HOLD TO KISS 💋</button>
</div>

<h2 style="color:#ff003c">Happy Kiss Day ❤️</h2>

<audio id="heartbeat" src="https://www.soundjay.com/human/heartbeat-01.mp3" loop></audio>

let holdTimer;
const btn=document.getElementById("holdBtn");

btn.onmousedown=startHold;
btn.ontouchstart=startHold;
btn.onmouseup=cancelHold;
btn.ontouchend=cancelHold;

function startHold(){
document.getElementById("heartbeat").play();
holdTimer=setTimeout(triggerCelebration,2000);
}
function cancelHold(){
clearTimeout(holdTimer);
document.getElementById("heartbeat").pause();
}

function triggerCelebration(){
document.getElementById("asking").style.display="none";
document.getElementById("celebration").style.display="block";
document.getElementById("song").play().catch(()=>{});

photoRain();

},400);
}

function startKissScene(){

<div class="head girl"><div class="eye"></div><div class="lips"></div></div>

document.querySelector(".girl").style.animation="kissMoveGirl 1s forwards";

function slideshow(){
const photos=[...Array(14)].map((_,i)=>`p${i+1}.jpeg`);
let i=0;
setInterval(()=>{
const img=document.getElementById("slideImg");
img.style.opacity=0;
setTimeout(()=>{i=(i+1)%photos.length;img.src=photos[i];img.style.opacity=1;},600);
},3000);

function photoRain(){
const photos=[...Array(14)].map((_,i)=>`p${i+1}.jpeg`);
setInterval(()=>{
const p=document.createElement("img");
p.src=photos[Math.floor(Math.random()*14)];

setTimeout(()=>p.style.top="110vh",100);
setTimeout(()=>p.remove(),6500);
