<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day ❤️</title>

<style>
:root{ --kiss-red:#ff003c; }

body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#300,#000);
font-family:Poppins,sans-serif;
color:#fff;
}

/* Floating Card */
.card{
text-align:center;
width:85%;max-width:400px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
padding:30px;border-radius:40px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 50px rgba(0,0,0,.6);
animation:floatCard 6s ease-in-out infinite;
z-index:10;
}
@keyframes floatCard{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.heartbeat{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* HOLD BUTTON */
#holdBtn{
background:linear-gradient(45deg,var(--kiss-red),#800020);
border:none;color:#fff;
padding:18px 40px;border-radius:50px;
font-size:18px;font-weight:bold;
cursor:pointer;overflow:hidden;
position:relative;
}
#holdBtn::after{
content:"";
position:absolute;
left:0;top:0;height:100%;width:0%;
background:rgba(255,255,255,.25);
transition:2s linear;
}

/* Hearts meet */
.heart{font-size:50px;position:absolute;transition:2s;}
.main-kiss{font-size:100px;animation:pulse 1s infinite}

#celebration{display:none}

.kiss-frame{
width:220px;height:180px;margin:20px auto;
background:url('https://cdn-icons-png.flaticon.com/512/2921/2921102.png') center/contain no-repeat;
display:flex;justify-content:center;align-items:center;
}
.kiss-frame img{
width:100px;height:100px;border-radius:50%;
object-fit:cover;transition:.8s;
}

/* Photo rain */
@keyframes fall{to{transform:translateY(110vh);opacity:0}}
.bgHeart{position:fixed;top:-50px;font-size:22px;animation:fall 7s linear forwards}
</style>
</head>

<body>

<div class="card heartbeat">

<div id="asking">
<div style="font-size:50px">💓</div>
<h2>Hold to send my heart 💞</h2>
<button id="holdBtn">HOLD TO KISS 💋</button>
</div>

<div id="celebration">
<div id="kissScene" style="height:120px;position:relative"></div>

<div class="kiss-frame">
<img id="slideImg" src="p1.jpeg">
</div>

<h2 style="color:#ff003c">Happy Kiss Day ❤️</h2>
<div id="typewriter"></div>
</div>

</div>

<audio id="heartbeat" src="https://www.soundjay.com/human/heartbeat-01.mp3" loop></audio>
<audio id="song" src="song.mp3"></audio>

<script>
let holdTimer;
const btn=document.getElementById("holdBtn");

btn.onmousedown=startHold;
btn.ontouchstart=startHold;
btn.onmouseup=cancelHold;
btn.ontouchend=cancelHold;

function startHold(){
btn.style.transform="scale(.9)";
btn.style.setProperty("--w","100%");
btn.querySelector("::after");
document.getElementById("heartbeat").play();
btn.style.setProperty("position","relative");
btn.style.setProperty("overflow","hidden");
btn.style.setProperty("--progress","100%");
btn.style.setProperty("backgroundSize","100% 100%");
holdTimer=setTimeout(triggerCelebration,2000);
btn.style.setProperty("backgroundImage","linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2))");
}
function cancelHold(){
clearTimeout(holdTimer);
document.getElementById("heartbeat").pause();
btn.style.transform="scale(1)";
btn.style.backgroundImage="none";
}

function triggerCelebration(){
document.getElementById("asking").style.display="none";
document.getElementById("celebration").style.display="block";
document.getElementById("song").play().catch(()=>{});
startKissScene();
photoRain();
slideshow();
typeWriter();
document.body.onclick=spawnKiss;

setInterval(()=>{
const h=document.createElement("div");
h.className="bgHeart";h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),7000);
},400);

setTimeout(()=>createFlash(),10000);
}

function startKissScene(){
const s=document.getElementById("kissScene");
s.innerHTML='<div id="h1" class="heart" style="left:-50px">❤️</div><div id="h2" class="heart" style="right:-50px">❤️</div>';
setTimeout(()=>{h1.style.left="40%";h2.style.right="40%";},100);
setTimeout(()=>{s.innerHTML='<div class="main-kiss">💋</div>';createFlash();},2100);
}

function slideshow(){
const photos=[...Array(14)].map((_,i)=>`p${i+1}.jpeg`);
let i=0;
setInterval(()=>{
const img=document.getElementById("slideImg");
img.style.opacity=0;
setTimeout(()=>{
i=(i+1)%photos.length;
img.src=photos[i];
img.style.opacity=1;
},600);
},3000);
}

function photoRain(){
const photos=[...Array(14)].map((_,i)=>`p${i+1}.jpeg`);
setInterval(()=>{
const p=document.createElement("img");
p.src=photos[Math.floor(Math.random()*14)];
p.style.cssText=`position:fixed;width:70px;left:${Math.random()*90}vw;top:-100px;transition:6s linear;border-radius:10px`;
document.body.appendChild(p);
setTimeout(()=>p.style.top="110vh",100);
setTimeout(()=>p.remove(),6500);
},1200);
}

function spawnKiss(e){
const k=document.createElement("div");
k.innerHTML="💋";
k.style.cssText=`position:absolute;left:${e.pageX}px;top:${e.pageY}px;font-size:30px;animation:fade 1s forwards`;
document.body.appendChild(k);
setTimeout(()=>k.remove(),1000);
}

function createFlash(){
const f=document.createElement("div");
f.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:white;opacity:.6;z-index:100;transition:1s";
document.body.appendChild(f);
setTimeout(()=>{f.style.opacity=0;setTimeout(()=>f.remove(),1000)},100);
}

function typeWriter(){
const text="Your kiss turns my world magical ❤️";
let i=0;
(function t(){
if(i<text.length){
document.getElementById("typewriter").innerHTML+=text[i++];
setTimeout(t,60);
}
})();
}
</script>
</body>
</html>
