<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day ❤️</title>

<style>
:root{ --kiss-red:#ff003c; }

body{
margin:0;height:100vh;overflow:hidden;
display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle,#300,#000);
font-family:Poppins,sans-serif;color:#fff;
}

/* Floating Card */
.card{
text-align:center;width:85%;max-width:400px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
padding:30px;border-radius:40px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 50px rgba(0,0,0,.6);
animation:floatCard 6s ease-in-out infinite;
z-index:10;
}
@keyframes floatCard{50%{transform:translateY(-10px)}}
.heartbeat{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* BUTTON */
#holdBtn{
background:linear-gradient(45deg,var(--kiss-red),#800020);
border:none;color:#fff;padding:18px 40px;
border-radius:50px;font-size:18px;font-weight:bold;
cursor:pointer;
}

/* HEART FALL BG */
@keyframes fall{to{transform:translateY(110vh);opacity:0}}
.bgHeart{position:fixed;top:-50px;font-size:22px;animation:fall 7s linear forwards}

/* Kiss Frame */
.kiss-frame{
width:220px;height:180px;margin:20px auto;
background:url('https://cdn-icons-png.flaticon.com/512/2921/2921102.png') center/contain no-repeat;
display:flex;justify-content:center;align-items:center;
}
.kiss-frame img{
width:100px;height:100px;border-radius:50%;
object-fit:cover;transition:.8s;
}

/* Corner Button */
#cornerBtn{
position:fixed;
bottom:20px;
right:20px;
background:linear-gradient(45deg,#ff003c,#800020);
color:#fff;
border:none;
padding:12px 22px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
z-index:999;
box-shadow:0 0 15px rgba(255,0,60,.6);
transition:.3s;
}

#cornerBtn.shake{
animation:shake .4s;
}
@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-5px)}
100%{transform:translateX(0)}
}

#kissLineBox{
position:fixed;
bottom:80px;
right:20px;
max-width:250px;
background:rgba(0,0,0,.7);
padding:15px;
border-radius:15px;
font-size:14px;
display:none;
}

/* Heart Burst */
.burstHeart{
position:fixed;
font-size:20px;
animation:burst 1s ease-out forwards;
pointer-events:none;
}
@keyframes burst{
to{
transform:translateY(-80px) scale(1.5);
opacity:0;
}
}

#celebration{display:none}
</style>
</head>

<body>

<div class="card heartbeat">
<div id="asking">
<div style="font-size:50px">💓</div>
<h2>Hold to send my heart 💞</h2>
<button id="holdBtn">HOLD TO KISS 💋</button>
</div>

<div id="celebration">
<div class="kiss-frame">
<img id="slideImg" src="p1.jpeg">
</div>
<h2 style="color:#ff003c">Happy Kiss Day ❤️</h2>
<div id="typewriter"></div>
</div>
</div>

<button id="cornerBtn">Click Here 💋</button>
<div id="kissLineBox"></div>

<audio id="heartbeat" src="https://www.soundjay.com/human/heartbeat-01.mp3" loop></audio>
<audio id="song" src="song.mp3"></audio>

<script>
let holdTimer;
const btn=document.getElementById("holdBtn");

btn.onmousedown=startHold;
btn.ontouchstart=startHold;
btn.onmouseup=cancelHold;
btn.ontouchend=cancelHold;

function startHold(){
document.getElementById("heartbeat").play();
holdTimer=setTimeout(triggerCelebration,2000);
}
function cancelHold(){
clearTimeout(holdTimer);
document.getElementById("heartbeat").pause();
}

function triggerCelebration(){
document.getElementById("asking").style.display="none";
document.getElementById("celebration").style.display="block";
document.getElementById("song").play().catch(()=>{});
typeWriter();
}

function typeWriter(){
const text="Your kiss makes my world magical ❤️";
let i=0;
(function t(){
if(i<text.length){
document.getElementById("typewriter").innerHTML+=text[i++];
setTimeout(t,60);
}})();
}

/* 🔥 CLICK BUTTON MAGIC 🔥 */

const kissLines = [
"Tumhare hoth meri favourite jagah hain 💋",
"Ek tumhari deep kiss… aur main khud ko bhool jaun 😈",
"Tumhari lipstick ka taste meri weakness hai ❤️‍🔥",
"Close aao… saanse mix hone do 🔥",
"Tumhari naughty kiss mujhe aur paas kheench leti hai 😘",
"Bas ek lambi si kiss… aur duniya gayab 💞",
"Tumhare hothon ka nasha coffee se bhi strong hai ☕💋",
"Jab tum bite karti ho… control mushkil ho jata hai 😏",
"Slow kiss se start karein… ya seedha passion mode? 🔥",
"Tumhari ek kiss = mera perfect moment ❤️"
];

let kissIndex = 0;

document.getElementById("cornerBtn").addEventListener("click", function(e){

// Shake button
this.classList.add("shake");
setTimeout(()=>this.classList.remove("shake"),400);

// Show line
const box = document.getElementById("kissLineBox");
box.style.display = "block";
box.innerHTML = kissLines[kissIndex];

// Voice Speak
const speech = new SpeechSynthesisUtterance(kissLines[kissIndex]);
speech.rate = 0.9;
speech.pitch = 1.1;
speech.lang = "en-US";
speechSynthesis.speak(speech);

// Heart Burst
for(let i=0;i<8;i++){
const heart=document.createElement("div");
heart.className="burstHeart";
heart.innerHTML="💖";
heart.style.left=(e.clientX + Math.random()*40-20)+"px";
heart.style.top=(e.clientY + Math.random()*20-10)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),1000);
}

kissIndex = (kissIndex + 1) % kissLines.length;

});
</script>

</body>
</html>
